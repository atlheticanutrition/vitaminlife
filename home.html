<style>
  @font-face{
    font-family: 'Manrope';
    src: url('{{ asset("css/Manrope-Variable.woff2") }}') format('woff2-variations'),

    font-weight: 200 800;
    font-style: normal;
    font-display: swap;
  }

  html, body{
    overflow: hidden !important;
  }

  .vl-manutencao{
    position: fixed;
    inset: 0;
    z-index: 999999;
    width: 100vw;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: space-between;
    padding: clamp(20px, 11.11vh, 90px) clamp(24px, 9.72vw, 140px);
    background-color: #06342f;
    background-image: url('{{ asset("img/manutencao-bg.png") }}');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    box-sizing: border-box;
  }

  .vl-manutencao *{ box-sizing: border-box; }

  .vl-logo{
    width: clamp(180px, 22.22vw, 320px);
    height: auto;
    display: block;
  }

  .vl-message{
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: clamp(12px, 1.67vw, 24px);
    width: clamp(220px, 37.5vw, 540px);
    max-width: 82vw;
  }

  .vl-heading{
    display: flex;
    flex-direction: column;
    gap: clamp(2px, 0.28vw, 4px);
    width: 100%;
    text-transform: uppercase;
    line-height: 1;
  }

  .vl-heading p{
    margin: 0;
    font-family: 'Manrope', sans-serif;
    overflow-wrap: break-word;
  }

  .vl-heading .vl-line-1{
    font-weight: 300;
    font-size: clamp(26px, 3.61vw, 52px);
    color: #ffffff;
  }

  .vl-heading .vl-line-2{
    font-weight: 200;
    font-size: clamp(30px, 4.44vw, 64px);
    color: rgba(255,255,255,0.7);
  }

  .vl-message .vl-copy{
    margin: 0;
    font-family: 'Manrope', sans-serif;
    font-weight: 400;
    font-size: clamp(13px, 1.11vw, 16px);
    line-height: clamp(19px, 1.81vw, 26px);
    color: rgba(255,255,255,0.7);
    overflow-wrap: break-word;
  }

  .vl-contact{
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: clamp(16px, 2.78vw, 40px);
  }

  .vl-contact-row{
    display: flex;
    align-items: center;
    gap: clamp(12px, 1.39vw, 20px);
  }

  a.vl-contact-row{
    text-decoration: none;
    color: inherit;
    transition: opacity 0.2s ease;
  }

  a.vl-contact-row:hover,
  a.vl-contact-row:focus-visible{
    opacity: 0.75;
  }

  .vl-icon-circle{
    flex-shrink: 0;
    width: clamp(44px, 3.89vw, 56px);
    height: clamp(44px, 3.89vw, 56px);
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .vl-icon-circle svg{
    width: clamp(18px, 1.67vw, 24px);
    height: clamp(18px, 1.67vw, 24px);
  }

  .vl-contact-text{
    display: flex;
    flex-direction: column;
    gap: clamp(2px, 0.28vw, 4px);
    white-space: nowrap;
  }

  .vl-contact-text .vl-label{
    margin: 0;
    font-family: 'Manrope', sans-serif;
    font-weight: 600;
    font-size: clamp(9px, 0.76vw, 11px);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
  }

  .vl-contact-text .vl-value{
    margin: 0;
    font-family: 'Manrope', sans-serif;
    font-weight: 500;
    font-size: clamp(13px, 1.25vw, 18px);
    color: #ffffff;
  }

  @media (max-width: 640px){
    .vl-contact-text{ white-space: normal; }
    .vl-contact-text .vl-value{ font-size: 14px; }
  }
</style>
