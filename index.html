<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vitaminlife — Site em Manutenção</title>
<meta name="description" content="Estamos trabalhando em uma nova experiência para você. Em breve, um novo site Vitaminlife.">
<link rel="icon" href="LOGO/LOGO_VITAMINLIFE_SLOGAN.svg" type="image/svg+xml">
<style>
  @font-face{
    font-family: 'Manrope';
    src: url('FONTS/Manrope-Variable.woff2') format('woff2-variations'),
         url('FONTS/Manrope-Variable.woff2') format('woff2');
    font-weight: 200 800;
    font-style: normal;
    font-display: swap;
  }

  @font-face{
    font-family: 'Inter';
    src: url('FONTS/Inter-Regular.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  :root{
    --pad-x: clamp(24px, 9.72vw, 140px);
    --pad-y: clamp(20px, 11.11vh, 90px);
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #06342f;
  }

  body{
    font-family: 'Inter', sans-serif;
  }

  .page{
    position: relative;
    width: 100vw;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: space-between;
    padding: var(--pad-y) var(--pad-x);
    background-image: url('IMAGES/imagem (1).png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }

  .logo{
    width: clamp(180px, 22.22vw, 320px);
    height: auto;
    display: block;
  }

  .message{
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: clamp(12px, 1.67vw, 24px);
    width: clamp(220px, 37.5vw, 540px);
    max-width: 82vw;
  }

  .heading{
    display: flex;
    flex-direction: column;
    gap: clamp(2px, 0.28vw, 4px);
    width: 100%;
    text-transform: uppercase;
    line-height: 1;
  }

  .heading p{
    margin: 0;
    font-family: 'Manrope', sans-serif;
    overflow-wrap: break-word;
  }

  .heading .line-1{
    font-weight: 300;
    font-size: clamp(26px, 3.61vw, 52px);
    color: #ffffff;
  }

  .heading .line-2{
    font-weight: 200;
    font-size: clamp(30px, 4.44vw, 64px);
    color: rgba(255,255,255,0.7);
  }

  .message p.copy{
    margin: 0;
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: clamp(13px, 1.11vw, 16px);
    line-height: clamp(19px, 1.81vw, 26px);
    color: rgba(255,255,255,0.7);
    overflow-wrap: break-word;
  }

  .contact{
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: clamp(16px, 2.78vw, 40px);
  }

  .contact-row{
    display: flex;
    align-items: center;
    gap: clamp(12px, 1.39vw, 20px);
  }

  a.contact-row{
    text-decoration: none;
    color: inherit;
    transition: opacity 0.2s ease;
  }

  a.contact-row:hover,
  a.contact-row:focus-visible{
    opacity: 0.75;
  }

  .icon-circle{
    flex-shrink: 0;
    width: clamp(44px, 3.89vw, 56px);
    height: clamp(44px, 3.89vw, 56px);
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .icon-circle svg{
    width: clamp(18px, 1.67vw, 24px);
    height: clamp(18px, 1.67vw, 24px);
  }


  .contact-text{
    display: flex;
    flex-direction: column;
    gap: clamp(2px, 0.28vw, 4px);
    white-space: nowrap;
  }

  .contact-text .label{
    margin: 0;
    font-family: 'Manrope', sans-serif;
    font-weight: 600;
    font-size: clamp(9px, 0.76vw, 11px);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
  }

  .contact-text .value{
    margin: 0;
    font-family: 'Manrope', sans-serif;
    font-weight: 500;
    font-size: clamp(13px, 1.25vw, 18px);
    color: #ffffff;
  }

  @media (max-width: 640px){
    .contact-text{ white-space: normal; }
    .contact-text .value{ font-size: 14px; }
  }
</style>
</head>
<body>
  <div class="page">
    <div class="logo-container">
      <img class="logo" src="LOGO/LOGO_VITAMINLIFE_SLOGAN.svg" alt="Vitaminlife — Sua vida em equilíbrio">
    </div>

    <div class="message">
      <div class="heading">
        <p class="line-1">SITE EM</p>
        <p class="line-2">MANUTENÇÃO</p>
      </div>
      <p class="copy">Estamos trabalhando em uma nova experiência para você. Em breve, um novo site, com a mesma essência e um futuro ainda mais saudável.</p>
    </div>

    <div class="contact">
      <div class="contact-row">
        <div class="icon-circle">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 6.5L12 13L21 6.5" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <rect x="3" y="4.5" width="18" height="15" rx="2" stroke="#ffffff" stroke-width="1.5"/>
          </svg>
        </div>
        <div class="contact-text">
          <p class="label">Fale com a gente</p>
          <p class="value">vendas@vitaminlife.com.br</p>
          <p class="value">sac@vitaminlife.com.br</p>
        </div>
      </div>

      <a class="contact-row contact-link" href="https://wa.me/5516997570458" target="_blank" rel="noopener noreferrer" aria-label="Conversar no WhatsApp: 16. 99757-0458">
        <div class="icon-circle">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path fill="#ffffff" d="M12.04 2.003c-5.514 0-9.984 4.47-9.984 9.984 0 1.762.464 3.484 1.345 4.997L2 22l5.157-1.352a9.935 9.935 0 0 0 4.883 1.24h.004c5.514 0 9.984-4.47 9.984-9.984 0-2.669-1.04-5.176-2.927-7.062a9.935 9.935 0 0 0-7.06-2.925zm.001 1.998a7.94 7.94 0 0 1 5.646 2.338 7.933 7.933 0 0 1 2.338 5.646c0 4.406-3.583 7.988-7.986 7.988a7.94 7.94 0 0 1-4.028-1.087l-.289-.172-3.06.803.817-2.982-.188-.306a7.927 7.927 0 0 1-1.219-4.243c0-4.406 3.582-7.985 7.985-7.985zm-3.19 4.075c-.164 0-.428.062-.652.312-.223.25-.85.83-.85 2.02 0 1.19.87 2.34.99 2.5.121.164 1.688 2.58 4.09 3.606.57.246 1.014.393 1.361.503.572.182 1.093.156 1.505.095.459-.068 1.412-.577 1.612-1.135.199-.559.199-1.038.14-1.138-.06-.1-.223-.16-.464-.28-.242-.12-1.412-.696-1.63-.775-.219-.08-.379-.12-.539.12-.16.24-.62.775-.76.934-.14.16-.28.18-.52.06-.242-.12-1.022-.377-1.949-1.203-.72-.643-1.207-1.436-1.348-1.677-.14-.24-.015-.37.106-.49.109-.108.242-.28.363-.42.121-.14.161-.24.242-.399.08-.16.04-.3-.02-.42-.06-.12-.539-1.315-.752-1.803-.198-.475-.4-.41-.548-.417a10.16 10.16 0 0 0-.469-.01z"/>
          </svg>
        </div>
        <div class="contact-text">
          <p class="label">WhatsApp</p>
          <p class="value">16. 99757-0458</p>
        </div>
      </a>

      <div class="contact-row">
        <div class="icon-circle">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M6.6 10.79c1.44 2.83 3.76 5.14 6.6 6.6l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.58.57.55 0 1 .45 1 1V19.9c0 .55-.45 1-1 1C10.61 20.9 3.1 13.39 3.1 4.1c0-.55.45-1 1-1H7.5c.55 0 1 .45 1 1 0 1.25.2 2.46.57 3.58.12.35.03.75-.25 1.02l-2.22 2.19z" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="contact-text">
          <p class="label">Telefone fixo</p>
          <p class="value">16. 3506-9800</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
