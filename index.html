<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vitaminlife — Site em Manutenção</title>
<meta name="description" content="Estamos trabalhando em uma nova experiência para você. Em breve, um novo site Vitaminlife.">
<link rel="icon" href="LOGO/LOGO_VITAMINLIFE_SLOGAN.svg" type="image/svg+xml">
<style>
  @font-face{
    font-family: 'Manrope';
    src: url('FONTS/Manrope-Variable.woff2') format('woff2-variations'),
         url('FONTS/Manrope-Variable.woff2') format('woff2');
    font-weight: 200 800;
    font-style: normal;
    font-display: swap;
  }

  @font-face{
    font-family: 'Inter';
    src: url('FONTS/Inter-Regular.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  :root{
    --pad-x: clamp(24px, 9.72vw, 140px);
    --pad-y: clamp(20px, 11.11vh, 90px);
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #06342f;
  }

  body{
    font-family: 'Inter', sans-serif;
  }

  .page{
    position: relative;
    width: 100vw;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: space-between;
    padding: var(--pad-y) var(--pad-x);
    background-image: url('IMAGES/imagem (1).png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }

  .logo{
    width: clamp(180px, 22.22vw, 320px);
    height: auto;
    display: block;
  }

  .message{
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: clamp(12px, 1.67vw, 24px);
    width: clamp(220px, 37.5vw, 540px);
    max-width: 82vw;
  }

  .heading{
    display: flex;
    flex-direction: column;
    gap: clamp(2px, 0.28vw, 4px);
    width: 100%;
    text-transform: uppercase;
    line-height: 1;
  }

  .heading p{
    margin: 0;
    font-family: 'Manrope', sans-serif;
    overflow-wrap: break-word;
  }

  .heading .line-1{
    font-weight: 300;
    font-size: clamp(26px, 3.61vw, 52px);
    color: #ffffff;
  }

  .heading .line-2{
    font-weight: 200;
    font-size: clamp(30px, 4.44vw, 64px);
    color: rgba(255,255,255,0.7);
  }

  .message p.copy{
    margin: 0;
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: clamp(13px, 1.11vw, 16px);
    line-height: clamp(19px, 1.81vw, 26px);
    color: rgba(255,255,255,0.7);
    overflow-wrap: break-word;
  }

  .contact{
    display: flex;
    align-items: center;
    gap: clamp(12px, 1.39vw, 20px);
  }

  .icon-circle{
    flex-shrink: 0;
    width: clamp(44px, 3.89vw, 56px);
    height: clamp(44px, 3.89vw, 56px);
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .icon-circle svg{
    width: clamp(18px, 1.67vw, 24px);
    height: clamp(18px, 1.67vw, 24px);
  }

  .contact-text{
    display: flex;
    flex-direction: column;
    gap: clamp(2px, 0.28vw, 4px);
    white-space: nowrap;
  }

  .contact-text .label{
    margin: 0;
    font-family: 'Manrope', sans-serif;
    font-weight: 600;
    font-size: clamp(9px, 0.76vw, 11px);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
  }

  .contact-text .email{
    margin: 0;
    font-family: 'Manrope', sans-serif;
    font-weight: 500;
    font-size: clamp(13px, 1.25vw, 18px);
    color: #ffffff;
  }

  @media (max-width: 640px){
    .contact-text{ white-space: normal; }
    .contact-text .email{ font-size: 14px; }
  }
</style>
</head>
<body>
  <div class="page">
    <div class="logo-container">
      <img class="logo" src="LOGO/LOGO_VITAMINLIFE_SLOGAN.svg" alt="Vitaminlife — Sua vida em equilíbrio">
    </div>

    <div class="message">
      <div class="heading">
        <p class="line-1">SITE EM</p>
        <p class="line-2">MANUTENÇÃO</p>
      </div>
      <p class="copy">Estamos trabalhando em uma nova experiência para você. Em breve, um novo site, com a mesma essência e um futuro ainda mais saudável.</p>
    </div>

    <div class="contact">
      <div class="icon-circle">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 6.5L12 13L21 6.5" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="3" y="4.5" width="18" height="15" rx="2" stroke="#ffffff" stroke-width="1.5"/>
        </svg>
      </div>
      <div class="contact-text">
        <p class="label">Fale com a gente</p>
        <p class="email">sac@vitaminlife.com.br</p>
      </div>
    </div>
  </div>
</body>
</html>
